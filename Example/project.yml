name: Example
options:
  bundleIdPrefix: so.kontext
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

packages:
  KontextVideoSDK:
    path: ../

targets:
  Example:
    type: application
    platform: iOS
    dependencies:
      - package: KontextVideoSDK
        product: KontextVideoSDK
    sources:
      - path: Example
        excludes:
          - Resources
      - path: Example/Resources
        buildPhase: resources
    info:
      path: Example/Info.plist
      properties:
        CFBundleDisplayName: Kontext Video
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSUserTrackingUsageDescription: The advertising identifier lets advertisers recognize you, so you see more relevant ads.
        # Kontext's ad network id, so installs from the demo's app-install ads can be attributed.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: mp7rpxwdrx.adattributionkit
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: so.kontext.example-video
        TARGETED_DEVICE_FAMILY: "1"
