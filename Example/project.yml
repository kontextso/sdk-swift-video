name: Example
options:
  bundleIdPrefix: so.kontext
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  KontextVideoSDK:
    path: ../

targets:
  Example:
    type: application
    platform: iOS
    dependencies:
      - package: KontextVideoSDK
        product: KontextVideoSDK
    sources:
      - path: Example
        excludes:
          - Resources
      - path: Example/Resources
        buildPhase: resources
    info:
      path: Example/Info.plist
      properties:
        CFBundleDisplayName: Kontext Drama
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The example talks to the mock ad server over plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: so.kontext.example-video
        TARGETED_DEVICE_FAMILY: "1"
