name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The tests build the SDK; this job builds the example app against it, which is what catches a public
  # API change that breaks a real integration.
  example:
    name: Example app
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build the example
        run: |
          set -o pipefail
          brew install xcodegen
          cd Example && xcodegen generate
          xcodebuild build \
            -project Example.xcodeproj \
            -scheme Example \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -50

  test:
    name: Test
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Simulators
        run: xcrun simctl list devices available | head -40
      - name: Run the tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme KontextVideoSDK \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "✔|✘|Test run|error:|TEST (SUCCEEDED|FAILED)"
