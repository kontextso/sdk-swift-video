name: CI

# Pushes to main and release tags, plus every pull request; a branch is checked through its PR, so a push
# to a branch with an open PR runs once, not twice. The same split as the ads repo's check workflow.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  # The same SwiftLint rules as sdk-swift (.swiftlint.yml). `analyze` needs a compiler log, so it builds first.
  lint:
    name: SwiftLint
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint && swiftlint --version
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: Build for analyze
        run: |
          set -o pipefail
          xcodebuild clean build \
            -scheme KontextVideoSDK-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            > xcodebuild.log 2>&1 || (tail -100 xcodebuild.log; exit 1)
      - name: No compiler warnings in the SDK
        # The analyzer does not fail on compiler warnings; a Swift 6 isolation warning is tomorrow's error.
        run: |
          if grep -E "Sources/KontextVideo(SDK|TTSDK)/.*: warning:" xcodebuild.log | sort -u | tee warnings.txt | grep -q .; then
            echo "::error::compiler warnings in the SDK"
            # With the compiler's notes under each warning, which name the expected types.
            grep -E -A4 "Sources/KontextVideo(SDK|TTSDK)/.*: warning:" xcodebuild.log; exit 1
          fi
      - name: Analyze
        run: swiftlint analyze --strict --compiler-log-path xcodebuild.log --reporter github-actions-logging

  # The tests build the SDK; this job builds the example app against it, which is what catches a public
  # API change that breaks a real integration.
  example:
    name: Example app
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build the example
        run: |
          set -o pipefail
          brew install xcodegen
          cd Example && xcodegen generate
          xcodebuild build \
            -project Example.xcodeproj \
            -scheme Example \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -50

  test:
    name: Test
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Simulators
        run: xcrun simctl list devices available | head -40
      - name: Run the tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme KontextVideoSDK-Package \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "✔|✘|Test run|error:|TEST (SUCCEEDED|FAILED)|Fatal error|precondition|Crash|crashed|Restarting after|exited abnormally|Terminating app"

  # The SDK supports iOS 14, but no runner can run an iOS 14 simulator: macos-14, the last image with Xcode 15,
  # is retired (November 2026), and the Xcodes left (16.x, 26.x) run iOS 15 or later simulators only. macos-15
  # comes with iOS 18.5 and later, so this job downloads iOS 15.5, the last iOS 15, from Apple on every run
  # (a few GB, a few minutes) and runs the whole suite on it: what an API newer than the deployment target
  # breaks at run time, outside an `if #available`, shows up here and not on iOS 18.
  test-oldest-ios:
    name: Test (iOS 15)
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install the iOS 15.5 simulator
        # xcodes is on the runner image; an iOS 15 runtime is a package installer, which needs root.
        run: |
          sudo xcodes runtimes install "iOS 15.5"
          xcrun simctl list runtimes
      - name: Create an iPhone 13 on iOS 15.5
        run: |
          udid=$(xcrun simctl create "iPhone 13 (iOS 15.5)" com.apple.CoreSimulator.SimDeviceType.iPhone-13 com.apple.CoreSimulator.SimRuntime.iOS-15-5)
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
      - name: Run the tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme KontextVideoSDK-Package \
            -destination "id=$SIMULATOR_ID" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "✔|✘|Test run|error:|TEST (SUCCEEDED|FAILED)|Fatal error|precondition|Crash|crashed|Restarting after|exited abnormally|Terminating app"

  # A release tag must be the version the SDK reports (SDKInfo.version), or publishers see one
  # version on GitHub and another in our logs; and the CHANGELOG, which is the release note, needs its section.
  release-tag:
    name: Release tag matches SDKInfo.version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="${GITHUB_REF_NAME}"
          version=$(sed -nE 's/.*static let version = "([^"]+)".*/\1/p' Sources/KontextVideoSDK/Payloads/SDKInfo.swift)
          echo "tag $tag, SDKInfo.version $version"
          [ "$tag" = "$version" ] || { echo "::error::tag $tag does not match SDKInfo.version $version"; exit 1; }
          grep -qxF "## $tag" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $tag' section"; exit 1; }
